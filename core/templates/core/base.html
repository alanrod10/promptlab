<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptLab - De una idea simple a un prompt extraordinario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .sidebar { width: 260px; min-height: 100vh; background-color: #12121e; color: white; }
        .sidebar a { color: #a1a1aa; text-decoration: none; padding: 12px 20px; display: block; border-radius: 8px; margin: 4px 12px; transition: all 0.2s;}
        .sidebar a:hover, .sidebar a.active { background-color: #27273f; color: #fff; }
        .brand-text { color: #9d8df1; font-weight: 700; letter-spacing: 0.5px;}
        .main-content { flex-grow: 1; background-color: #f7f7f9; height: 100vh; overflow-y: auto; }
        .btn-brand { background-color: #635bff; color: white; border: none; }
        .btn-brand:hover { background-color: #534be5; color: white; }
    </style>
</head>
<body class="d-flex">
    <nav class="sidebar d-flex flex-column py-3">
        <h4 class="mb-4 px-4 brand-text"><i class="bi bi-stars text-warning me-1"></i> PromptLab</h4>
        <a href="{% url 'workspace' %}" class="{% if request.resolver_match.url_name == 'workspace' %}active{% endif %}">
            <i class="bi bi-house-door me-2"></i> Espacio de Trabajo
        </a>
        <a href="{% url 'history' %}" class="{% if request.resolver_match.url_name == 'history' %}active{% endif %}">
            <i class="bi bi-clock-history me-2"></i> Mi Historial
        </a>
        <a href="{% url 'favorites' %}" class="{% if request.resolver_match.url_name == 'favorites' %}active{% endif %}">
            <i class="bi bi-star me-2"></i> Favoritos
        </a>
        <a href="{% url 'templates_gallery' %}" class="{% if request.resolver_match.url_name == 'templates_gallery' %}active{% endif %}">
            <i class="bi bi-grid me-2"></i> Plantillas
        </a>
        <a href="{% url 'analytics' %}" class="{% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">
            <i class="bi bi-bar-chart-line me-2"></i> Analítica y Datos
        </a>
        <div class="mt-auto">
            <hr class="text-secondary mx-3">
            <div class="px-4 py-2 small text-secondary d-flex align-items-center">
                <span class="badge rounded-pill bg-success bg-opacity-25 text-success me-2 p-1">
                    <i class="bi bi-circle-fill" style="font-size: 0.45rem;"></i>
                </span>
                <span>Motor Heurístico v3.0 • Rúbrica Activa</span>
            </div>
        </div>
    </nav>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
